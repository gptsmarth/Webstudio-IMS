openapi: 3.1.0
info:
  title: WEBSTUDIO IMS — Platform Version API
  version: 1.0.0
paths:
  /api/v1/version:
    get:
      summary: API and backend version information
      tags: [platform]
      responses:
        "200":
          description: Version identity envelope
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required:
                      - version
                      - build_number
                      - git_commit
                      - release_channel
                      - database_revision
                      - backend_version
                      - api_version
                    properties:
                      version:
                        type: string
                      build_number:
                        type: integer
                      git_commit:
                        type: string
                      git_short:
                        type: string
                      release_date:
                        type: string
                        nullable: true
                      release_channel:
                        type: string
                        enum: [development, beta, stable]
                      database_revision:
                        type: string
                      version_identity:
                        type: object
                      backend_version:
                        type: string
                      schema_version:
                        type: string
                      api_version:
                        type: string
                      build_version:
                        type: string
                      min_desktop_version:
                        type: string
                      min_mobile_version:
                        type: string
                      desktop:
                        type: object
                      mobile:
                        type: object
