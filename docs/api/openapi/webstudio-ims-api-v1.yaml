# WEBSTUDIO IMS API v1 — OpenAPI Specification
# Canonical API contract
openapi: 3.1.0
info:
  title: WEBSTUDIO IMS API
  version: 1.0.0
  description: WEBSTUDIO IMS version 1 API
paths:
  /api/v1/asus-activation:
    get:
      summary: List ASUS activation claims for a sale month
      description: Requires reports:export. Includes uploaded periods and claim totals.
      parameters:
        - name: month
          in: query
          schema: { type: string, pattern: '^[0-9]{4}-[0-9]{2}$' }
        - name: search
          in: query
          description: Searches serial or IMEI, invoice and model across all months.
          schema: { type: string, maxLength: 160 }
      responses:
        '200':
          description: Activation dashboard in the standard data envelope.
  /api/v1/asus-activation/schemes:
    post:
      summary: Import an ASUS activation workbook for an inclusive sale date range
      description: Requires reports:export and settings:modify. Workbook dates are reference information.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, date_from, date_to]
              properties:
                file: { type: string, format: binary }
                date_from: { type: string, format: date }
                date_to: { type: string, format: date }
      responses:
        '200':
          description: Scheme identifier, imported rate count and matching sales already recorded for the selected dates.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [id, date_from, date_to, filename, rule_count, matched_sale_count]
                    properties:
                      id: { type: string, format: uuid }
                      date_from: { type: string, format: date }
                      date_to: { type: string, format: date }
                      filename: { type: string }
                      rule_count: { type: integer }
                      matched_sale_count: { type: integer }
        '409':
          description: An uploaded period overlaps the requested dates.
        '422':
          description: Invalid range, workbook, or conflicting model rates.
  /api/v1/asus-activation/schemes/{scheme_id}/edit:
    post:
      summary: Preview or confirm edits to a recent activation scheme
      description: Requires reports:export and settings:modify. Dates are inclusive. Supplement keeps the current period and previews conflicting model rates. Confirm with the same inputs, preview ID and one decision for each conflict.
      parameters:
        - name: scheme_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [mode, date_from, date_to]
              properties:
                mode: { type: string, enum: [dates, replace, supplement] }
                date_from: { type: string, format: date }
                date_to: { type: string, format: date }
                file: { type: string, format: binary }
                preview_id: { type: string, pattern: '^[a-f0-9]{64}$' }
                choices:
                  type: string
                  description: JSON object keyed by model. Each value has use set to existing or incoming. Incoming may include date_from and date_to for a subrange.
      responses:
        '200':
          description: Preview ID, model conflicts with effective dates and rates, or the applied scheme and matched sale count.
        '404':
          description: Scheme does not exist.
        '409':
          description: Period overlaps, edit window expired, or the scheme changed since preview.
        '422':
          description: Invalid workbook, range, or conflict decisions.
  /api/v1/asus-activation/receipts:
    post:
      summary: Preview or confirm an ASUS credit-note workbook
      description: Requires reports:export and settings:modify. Resubmit the same workbook with the preview identifier to apply.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                preview_id: { type: string, minLength: 64, maxLength: 64 }
      responses:
        '200':
          description: Receipt rows, amounts and outcomes in the standard data envelope.
        '409':
          description: Claims changed since preview. Review the workbook again.
        '422':
          description: Invalid receipt workbook or invalid confirmation.
  /api/v1/asus-activation/claims/{sale_id}/receipt:
    post:
      summary: Record a manual ASUS credit receipt or resolve its variance
      description: Requires reports:export and settings:modify. Manual amounts are before GST.
      parameters:
        - name: sale_id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [record, resolve] }
                amount: { type: [string, 'null'] }
                note: { type: string, maxLength: 2000 }
      responses:
        '200':
          description: Updated claim in the standard data envelope.
        '409':
          description: A receipt is already recorded or the claim has no unresolved variance.
        '422':
          description: Invalid amount or missing resolution note.
  /api/v1/asus-activation/claims/{sale_id}/expected:
    put:
      summary: Correct the expected CN for a sale or the same model across its scheme
      description: Requires reports:export and settings:modify. Actual receipts stay recorded and variance is recalculated. A null amount clears the individual sale correction.
      parameters:
        - name: sale_id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, note]
              properties:
                amount: { type: [string, 'null'], maxLength: 32 }
                note: { type: string, minLength: 1, maxLength: 2000 }
                scope: { type: string, enum: [sale, model], default: sale }
      responses:
        '200':
          description: Updated claim in the standard data envelope.
        '404':
          description: Claim no longer exists or has no applicable scheme.
        '409':
          description: Scheme edit window has expired for a model-wide correction.
        '422':
          description: Invalid amount or missing reason.
  /api/v1/asus-activation/export:
    get:
      summary: Download activation claims and receipt details in Excel
      description: Requires reports:export. Omit month to include all sale months.
      parameters:
        - name: month
          in: query
          schema: { type: string, pattern: '^[0-9]{4}-[0-9]{2}$' }
        - name: status
          in: query
          schema: { type: string, enum: [pending, discrepancy, received, all], default: all }
        - name: search
          in: query
          schema: { type: string, maxLength: 160 }
      responses:
        '200':
          description: Workbook with claims for the selected sale month and status.
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
  /api/v1/comparison/inventory:
    get:
      summary: Search available inventory laptops for comparison
      description: Requires inventory:view. Returns saved model data and saleable stock without enrichment.
      parameters:
        - name: search
          in: query
          schema: { type: string, maxLength: 160 }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: page_size
          in: query
          schema: { type: integer, minimum: 1, maximum: 30, default: 8 }
      responses:
        '200':
          description: Comparison laptops in data and pagination in meta.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/ComparisonLaptop' } }
                  meta: { type: object }
        '403':
          description: Inventory view permission required.
  /api/v1/comparison/inventory/{model_id}/image:
    get:
      summary: Read the saved managed image for an in-stock laptop
      description: Requires inventory:view. A missing image is not researched or repaired.
      parameters:
        - name: model_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Managed image.
        '404':
          description: No saved image file for the model.
  /api/v1/comparison/inventory/{model_id}/processor:
    post:
      summary: Find additional processor facts for a selected in-stock laptop
      description: Requires inventory:view. Uses the saved processor or verifies the exact laptop first. Returns additional comparison rows without updating inventory.
      parameters:
        - name: model_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Additional specifications in data, or an empty list when unavailable.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [component, detail]
                      properties:
                        component: { type: string }
                        detail: { type: string }
        '404':
          description: Inventory laptop unavailable.
  /api/v1/comparison/external:
    post:
      summary: Research an exact laptop model outside inventory
      description: Requires inventory:view. Uses exact-variant source evidence and reuses verified research for 30 days.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [brand, model_number]
              properties:
                brand: { type: string, minLength: 1, maxLength: 80 }
                model_number: { type: string, minLength: 1, maxLength: 160 }
      responses:
        '200':
          description: External model specifications in data.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/ComparisonLaptop' }
        '403':
          description: Inventory view permission required.
        '404':
          description: Reliable specifications for an exact match are unavailable.
        '422':
          description: Invalid manufacturer or model number.
        '429':
          description: Gemini temporarily rate limited the lookup.
        '503':
          description: External research is unavailable.
  /api/v1/reports/asus-weekly:
    get:
      summary: Download the ASUS weekly sell-out workbook
      description: Requires reports:export. Dates are inclusive and use the India business calendar.
      parameters:
        - name: date_from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: date_to
          in: query
          required: true
          schema: { type: string, format: date }
        - name: products
          in: query
          schema: { type: string, enum: [laptops, accessories, both], default: laptops }
      responses:
        '200':
          description: XLSX with the eight ASUS sell-out columns and one row per recorded unit.
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
        '403':
          description: Report export permission required.
        '422':
          description: Invalid date range or selected sales that lack verified export values.
  /api/v1/sales/{sale_id}:
    get:
      summary: Read an inventory sale and its Tally invoice
      parameters:
        - name: sale_id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Sale detail with per-unit sale amounts and, when available, the full Tally invoice.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      sale_amount:
                        type: [number, 'null']
                        description: Amount for the inventory unit represented by this sale.
                      invoice_totals:
                        type: [object, 'null']
                        properties:
                          grand_total:
                            type: [number, string, 'null']
                            description: Full Tally bill total, including all billed products.
                      invoice_items:
                        type: array
                        description: All billed items in Tally order, including items without a separate IMS sale.
                        items:
                          $ref: '#/components/schemas/SaleInvoiceItem'
        '404':
          description: Sale not found.
components:
  schemas:
    ComparisonLaptop:
      type: object
      required: [source, brand, model_number, specifications]
      properties:
        source: { type: string, enum: [inventory, external] }
        model_id: { type: [string, 'null'], format: uuid }
        brand: { type: string }
        model_number: { type: string }
        model_name: { type: [string, 'null'] }
        image_url: { type: [string, 'null'] }
        managed_image: { type: boolean }
        available_units: { type: [integer, 'null'] }
        selling_price: { type: [string, 'null'] }
        saved_notes: { type: [string, 'null'] }
        specifications:
          type: array
          items:
            type: object
            required: [component, detail]
            properties:
              component: { type: string }
              detail: { type: string }
    SaleInvoiceItem:
      type: object
      required: [line_index, product_name, quantity, tracking]
      properties:
        line_index: { type: integer }
        product_name: { type: string }
        quantity: { type: [string, 'null'] }
        tracking: { type: string, enum: [tracked, additional, unmatched, unclassified] }
        amount_excluding_gst: { type: [string, 'null'] }
        cgst_amount: { type: [string, 'null'] }
        sgst_amount: { type: [string, 'null'] }
        igst_amount: { type: [string, 'null'] }
        cess_amount: { type: [string, 'null'] }
        amount_including_gst: { type: [string, 'null'] }
        gst_allocated:
          type: boolean
          description: Item GST was calculated from Tally's rate or apportioned from the invoice ledger.
