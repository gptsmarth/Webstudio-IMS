# WEBSTUDIO IMS — Enterprise Release Pipeline (M13G)
# On every release tag: quality gate → build all artifacts → manifest/checksums → GitHub Release upload.
# Does NOT deploy to production — server sync is administrator-controlled (M13B/M13C).

name: Enterprise Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: enterprise-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://webstudio_app:webstudio_app@localhost:5432/webstudio_test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: webstudio_app
          POSTGRES_PASSWORD: webstudio_app
          POSTGRES_DB: webstudio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U webstudio_app -d webstudio_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Sync VERSION from tag
        if: startsWith(github.ref, 'refs/tags/')
        run: bash scripts/release/sync-version-from-tag.sh "${GITHUB_REF_NAME}"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "apps/backend[dev]"

      - name: Backend lint (Ruff)
        run: ruff check apps/backend/src apps/backend/tests database/migrations

      - name: Backend format (Black)
        run: black --check apps/backend/src apps/backend/tests database/migrations

      - name: Backend tests
        run: pytest apps/backend/tests -q

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install monorepo dependencies
        run: pnpm install --frozen-lockfile

      - name: Prettier check
        run: pnpm format:check

      - name: ESLint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Desktop unit tests
        run: pnpm --filter @webstudio/desktop test

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter analyze
        working-directory: apps/mobile_flutter
        run: |
          flutter pub get
          flutter analyze

      - name: Flutter tests
        working-directory: apps/mobile_flutter
        run: flutter test

  backend-package:
    name: Build Backend Package
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync VERSION from tag
        if: startsWith(github.ref, 'refs/tags/')
        run: bash scripts/release/sync-version-from-tag.sh "${GITHUB_REF_NAME}"
      - run: bash scripts/release/package-backend.sh
      - uses: actions/upload-artifact@v4
        with:
          name: backend-package
          path: release/backend/webstudio-backend-*.tar.gz
          if-no-files-found: error

  desktop-windows:
    name: Build Desktop EXE
    needs: quality-gate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm desktop:package:win
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-setup
          path: apps/desktop/release/desktop/WEBSTUDIO Desktop Setup.exe
          if-no-files-found: error

  desktop-macos:
    name: Build Desktop DMG
    needs: quality-gate
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm desktop:package:mac
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-dmg
          path: apps/desktop/release/desktop/WEBSTUDIO Desktop.dmg
          if-no-files-found: error

  mobile-android:
    name: Build Android APK
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: pnpm release:sync-branding
      - run: bash scripts/release/build-android-apk.sh
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-android-apk
          path: release/mobile/WEBSTUDIO IMS.apk
          if-no-files-found: error

  mobile-ios:
    name: Build iOS Archive
    needs: quality-gate
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: bash scripts/release/build-ios-ipa.sh
      - name: Zip iOS archive for distribution
        run: |
          if [[ -d release/mobile/ios/WEBSTUDIO-IMS.xcarchive ]]; then
            cd release/mobile/ios
            zip -qr WEBSTUDIO-IMS.xcarchive.zip WEBSTUDIO-IMS.xcarchive
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-ios-archive
          path: |
            release/mobile/ios/WEBSTUDIO-IMS.xcarchive.zip
            release/mobile/ios/WEBSTUDIO-IMS.xcarchive
          if-no-files-found: warn

  server-windows:
    name: Build Server Windows Setup
    needs: quality-gate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Inno Setup
        run: choco install innosetup -y
      - run: powershell -ExecutionPolicy Bypass -File scripts/release/build-server-setup.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: server-windows-setup
          path: release/server/WEBSTUDIO Server Setup.exe
          if-no-files-found: error

  release-bundle:
    name: Generate Manifest, Checksums, Release Notes
    needs:
      - backend-package
      - desktop-windows
      - desktop-macos
      - mobile-android
      - mobile-ios
      - server-windows
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      bundle_dir: ${{ steps.bundle.outputs.bundle_dir }}
    steps:
      - uses: actions/checkout@v4

      - name: Sync VERSION from tag
        if: startsWith(github.ref, 'refs/tags/')
        run: bash scripts/release/sync-version-from-tag.sh "${GITHUB_REF_NAME}"

      - id: version
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Stage CI artifacts
        run: bash scripts/release/stage-ci-artifacts.sh artifacts

      - name: Prepare release bundle
        run: bash scripts/release/prepare-release.sh

      - id: bundle
        run: |
          BUNDLE="release/v$(cat VERSION)"
          echo "bundle_dir=$BUNDLE" >> "$GITHUB_OUTPUT"
          echo "Release bundle: $BUNDLE"
          ls -la "$BUNDLE"

      - name: Create release bundle ZIP
        run: |
          VERSION="$(cat VERSION)"
          cd release
          zip -r "webstudio-ims-v${VERSION}-bundle.zip" "v${VERSION}"

      - uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: |
            release/v*/
            release/webstudio-ims-v*-bundle.zip

  publish-github-release:
    name: Publish GitHub Release (no deploy)
    needs: release-bundle
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: release-bundle
          path: release

      - name: Collect release assets
        run: |
          VERSION="${{ needs.release-bundle.outputs.version }}"
          BUNDLE="release/v${VERSION}"
          mkdir -p release-assets
          cp "$BUNDLE/version-manifest.json" release-assets/
          cp "$BUNDLE/checksums.sha256" release-assets/
          cp "$BUNDLE/RELEASE_NOTES.md" release-assets/
          cp "$BUNDLE/WEBSTUDIO Desktop Setup.exe" release-assets/ 2>/dev/null || true
          cp "$BUNDLE/WEBSTUDIO Desktop.dmg" release-assets/ 2>/dev/null || true
          cp "$BUNDLE/WEBSTUDIO IMS.apk" release-assets/ 2>/dev/null || true
          cp "$BUNDLE/WEBSTUDIO Server Setup.exe" release-assets/ 2>/dev/null || true
          cp "$BUNDLE/webstudio-backend-${VERSION}.tar.gz" release-assets/ 2>/dev/null || true
          cp "$BUNDLE/WEBSTUDIO-IMS.xcarchive.zip" release-assets/ 2>/dev/null || true
          cp "release/webstudio-ims-v${VERSION}-bundle.zip" release-assets/ 2>/dev/null || true
          ls -la release-assets/

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: WEBSTUDIO IMS ${{ needs.release-bundle.outputs.version }}
          body_path: release/v${{ needs.release-bundle.outputs.version }}/RELEASE_NOTES.md
          files: release-assets/*
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Confirm no auto-deploy
        run: |
          echo "Enterprise release published to GitHub only."
          echo "WEBSTUDIO Server does NOT auto-deploy — administrator approval required (M13C)."
