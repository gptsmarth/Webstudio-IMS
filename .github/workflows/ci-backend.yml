# WEBSTUDIO IMS — ci-backend
name: ci-backend

on:
  push:
    branches: [main, develop]
    paths:
      - "apps/backend/**"
      - "database/**"
      - ".github/workflows/ci-backend.yml"
  pull_request:
    paths:
      - "apps/backend/**"
      - "database/**"
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e "apps/backend[dev]"
      - run: ruff check apps/backend/src apps/backend/tests database/migrations
      - run: black --check apps/backend/src apps/backend/tests database/migrations
      - run: pytest apps/backend/tests -q
        env:
          APP_ENV: test
