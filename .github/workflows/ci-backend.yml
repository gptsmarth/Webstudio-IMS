# WEBSTUDIO IMS — ci-backend
name: ci-backend

on:
  push:
    branches: [main, develop]
    paths:
      - "apps/backend/**"
      - "database/**"
      - ".github/workflows/ci-backend.yml"
  pull_request:
    paths:
      - "apps/backend/**"
      - "database/**"
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://webstudio_app:webstudio_app@localhost:5432/webstudio_test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: webstudio_app
          POSTGRES_PASSWORD: webstudio_app
          POSTGRES_DB: webstudio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U webstudio_app -d webstudio_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e "apps/backend[dev]"
      - run: ruff check apps/backend/src apps/backend/tests database/migrations
      - run: black --check apps/backend/src apps/backend/tests database/migrations
      - run: pytest apps/backend/tests -q
