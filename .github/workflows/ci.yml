name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://webstudio_app:webstudio_app@localhost:5432/webstudio_test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: webstudio_app
          POSTGRES_PASSWORD: webstudio_app
          POSTGRES_DB: webstudio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U webstudio_app -d webstudio_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "apps/backend[dev]"
      - name: Verify alembic and database migrations
        run: |
          python -c "import alembic; print('alembic', alembic.__version__)"
          bash tools/scripts/alembic.sh current
      - name: Ruff
        run: ruff check apps/backend/src apps/backend/tests database/migrations
      - name: Black
        run: black --check apps/backend/src apps/backend/tests database/migrations
      - name: Pytest
        run: pytest apps/backend/tests

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile || pnpm install
      - name: Prettier
        run: pnpm format:check
      - name: ESLint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
