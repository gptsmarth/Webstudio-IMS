# WEBSTUDIO IMS — ci-desktop
name: ci-desktop

on:
  push:
    branches: [main, develop]
    paths:
      - "apps/desktop/**"
      - "packages/**"
      - ".github/workflows/ci-desktop.yml"
  pull_request:
    paths:
      - "apps/desktop/**"
      - "packages/**"
  workflow_dispatch:

jobs:
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-build-env
        with:
          install-python: "false"
          install-flutter: "false"
      - run: pnpm format:check
      - run: pnpm --filter @webstudio/desktop lint
      - run: pnpm --filter @webstudio/desktop typecheck
      - run: pnpm --filter @webstudio/desktop test
      - run: pnpm --filter @webstudio/desktop build
