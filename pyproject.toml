[project]
name = "webstudio-ims"
version = "0.1.0"
description = "WEBSTUDIO IMS backend workspace"
requires-python = ">=3.12"
dependencies = []

[tool.black]
line-length = 100
target-version = ["py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
  \.venv
  | node_modules
  | apps/mobile/android
)/
'''

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["apps/backend/src", "apps/backend/tests", "database/migrations"]
extend-exclude = ["apps/mobile/android"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "UP046"]

[tool.ruff.lint.isort]
known-first-party = ["webstudio_backend"]

[tool.pytest.ini_options]
testpaths = ["apps/backend/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
pythonpath = ["apps/backend/src", "apps/backend/tests"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
packages = ["webstudio_backend"]
