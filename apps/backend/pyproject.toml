[project]
name = "webstudio-backend"
version = "0.1.0"
description = "WEBSTUDIO IMS FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "loguru>=0.7.2",
    "python-dotenv>=1.0.1",
    "argon2-cffi>=23.1.0",
    "PyJWT>=2.9.0",
    "openpyxl>=3.1.5",
    "reportlab>=4.2.0",
    "httpx>=0.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "black>=24.10.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/webstudio_backend"]

[project.scripts]
webstudio-api = "webstudio_backend.main:run"
