name: webstudio_ims
description: Official WEBSTUDIO IMS mobile client — Android primary, iOS compatible.
publish_to: none
version: 1.7.0+11

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  bonsoir: ^5.1.3
  camera: ^0.11.0+2
  connectivity_plus: ^6.1.1
  crypto: ^3.0.6
  dio: ^5.7.0
  equatable: ^2.0.7
  file_picker: ^10.1.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^18.0.1
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^9.2.4
  flutter_svg: ^2.0.16
  go_router: ^14.6.2
  google_fonts: ^6.2.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  image_picker: ^1.1.2
  intl: ^0.19.0
  mobile_scanner: ^7.2.0
  package_info_plus: ^8.1.2
  path_provider: ^2.1.5
  permission_handler: ^11.3.1
  open_file: ^3.5.10
  share_plus: ^10.1.4
  shared_preferences: ^2.3.3
  url_launcher: ^6.3.1
  uuid: ^4.5.1

dev_dependencies:
  flutter_launcher_icons: ^0.14.3
  flutter_lints: ^5.0.0
  flutter_native_splash: ^2.4.4
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  mocktail: ^1.0.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/icon.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/images/icon.png
  remove_alpha_ios: true
  min_sdk_android: 26

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/images/icon.png
  android_12:
    color: "#FFFFFF"
    image: assets/images/icon.png
  ios: true
  web: false

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/brand-logos/
